<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Battleship</title>
  </head>
  <body>
    <div class="modal-background hide">
      <div id="name-modal" class="modal">
        <div class="modal-header">
          <div class="close-button"><img src="./assets/close-box.svg"></div>
        </div>
        <div class="modal-body">
          <form id="names">
            <div id="name-1" class="input-div">
              <label id="name-label-1" for="name-input-1">What's your name, sailor?</label>
              <input type="text" name="name-input-1" id="name-input-1">
            </div>
            <div id="name-2" class="input-div">
              <label id="name-label-2" for="name-input-2">And yours, respected enemy?</label>
              <input type="text" name="name-input-2" id="name-input-2">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="name-submit">Confirm</button>
        </div>
      </div>
    </div>
    <div class="container">
      <div id="playground">
        <h1>Battleship!!!</h1>
        <h2></h2>
        <div id="player-count">
          <p>Do you have a human opponent, or is this a computerized war game, admiral?</p>
          <button class="1">War Game</button>
          <button class="2">Human Enemy</button>
        </div>
        <div id="place-buttons" class="hide">
          <button class="place 1">Place Ships Player 1</button>
          <button class="place 2">Place Ships Player 2</button>
        </div>
        <div class="instructions"></div>
        <div id="boards">
          <div id="placement-board"></div>
          <div id="my-board" class="hide"></div>
          <div id="enemy-board" class="hide"></div>
        </div>
        <button id="confirm" class="hide">Confirm Placement</button>
        <div id="obfuscation" class="hide">
          <p>Press the button below before passing the screen to your opponent.</p>
          <button id="pass">Apply camouflage!</button>
        </div>
        <div id="take-conn" class="hide">
          <p>Press the button below to begin your attack.</p>
          <button id="receive">Take the Conn!</button>
        </div>
      </div>
      <div class="sidebar">
        <div id="ships">
          <div id="carrier" class="ship-image"><img src="./assets/ship-side.png"></div>
          <div id="battleship" class="ship-image"><img src="./assets/ship-side.png"></div>
          <div id="cruiser" class="ship-image"><img src="./assets/ship-side.png"></div>
          <div id="submarine" class="ship-image"><img src="./assets/ship-side.png"></div>
          <div id="destroyer" class="ship-image"><img src="./assets/ship-side.png"></div>
      </div>
    </div>
  </body>
</html>
