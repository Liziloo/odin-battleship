<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Battleship</title>
  </head>
  <body>
    <div class="container">
      <h1>Battleship!!!</h1>
      <h2></h2>
      <div id="player-count">
        <p>Do you have a human opponent, or is this a computerized war game, admiral?</p>
        <button class="1">War Game</button>
        <button class="2">Human Enemy</button>
      </div>
      <div id="place-buttons" class="hide">
        <button class="place 1">Place Ships Player 1</button>
        <button class="place 2">Place Ships Player 2</button>
      </div>
      <div class="instructions"></div>
      <div id="boards">
        <div id="placement-board" class="hide"></div>
        <div id="my-board" class="hide"></div>
        <div id="enemy-board" class="hide"></div>
        <div id="ships">
          <div id="carrier" class="ship"></div>
          <div id="battleship" class="ship"></div>
          <div id="cruiser" class="ship"></div>
          <div id="destroyer" class="ship"></div>
        </div>
      </div>
      <button id="confirm" class="hide">Confirm Placement</button>
      <div id="obfuscation" class="hide">
        <p>Press the button below before passing the screen to your opponent.</p>
        <button id="pass">Apply camouflage!</button>
      </div>
      <div id="take-conn" class="hide">
        <p>Press the button below to begin your attack.</p>
        <button id="receive">Take the Conn!</button>
      </div>
    </div>
  </body>
</html>
